version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ops_center_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ops_center
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: ops_center_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
